<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wellbeing Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 260px;
      background: #0f172a;
      color: #f1f5f9;
    }

    .popup { padding: 16px; }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.6rem;
      color: #64748b;
      margin-top: 2px;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.inactive { background: #ef4444; }

    .status-text { font-size: 0.8rem; }
    .status-email { font-size: 0.7rem; color: #64748b; }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8;
    }

    .btn-outline:hover {
      border-color: #06b6d4;
      color: #06b6d4;
    }

    .not-logged-in {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
<div class="popup">
  <div class="header">
    <div class="logo">Wellbeing</div>
    <div class="subtitle">Productivity Tracker</div>
  </div>

  <!-- Logged-in View -->
  <div id="loggedInView" style="display:none">
    <div class="status-card">
      <div class="status-dot active"></div>
      <div>
        <div class="status-text">Tracking active</div>
        <div class="status-email" id="userEmail">—</div>
      </div>
    </div>

    <!-- Metrics Box -->
    <div id="metricsArea" style="background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; margin-bottom: 12px; display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 0.75rem; color: #94a3b8;">Today's Score</span>
        <span id="popupScore" style="font-size: 1.1rem; font-weight: 800; color: #22c55e;">--%</span>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.05); margin-bottom: 8px;"></div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
        <span style="font-size: 0.75rem; color: #94a3b8;">Productive</span>
        <span id="popupProductive" style="font-size: 0.75rem; font-weight: 600; color: #22c55e;">--</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 0.75rem; color: #94a3b8;">Distracting</span>
        <span id="popupDistracting" style="font-size: 0.75rem; font-weight: 600; color: #ef4444;">--</span>
      </div>
    </div>

    <button id="openDashboard" class="btn btn-primary">📊 Open Dashboard</button>
    <button id="logoutBtn" class="btn btn-outline">Logout</button>
  </div>

  <!-- Not logged in View -->
  <div id="notLoggedInView" style="display:none">
    <div class="status-card">
      <div class="status-dot inactive"></div>
      <div>
        <div class="status-text">Not logged in</div>
        <div class="status-email">Tracking paused</div>
      </div>
    </div>
    <p class="not-logged-in">Log in via the dashboard to start tracking</p>
    <button id="openLoginBtn" class="btn btn-primary">Open Dashboard Login</button>
  </div>
</div>

<script src="browser-polyfill.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
